<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2f5d50"><meta name="description" content="FitMatch ti aiuta ad abbinare i colori di maglie, pantaloni e scarpe."><link rel="icon" href="icons/icon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png"><title>FitMatch</title><link rel="manifest" href="manifest.webmanifest"><style>*{box-sizing:border-box}body{margin:0;background:#f5efe1;color:#22303c;font:17px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;padding-bottom:28px}main{max-width:560px;margin:auto;padding:18px}header{text-align:center;margin:8px 0 18px}h1{color:#2f5d50;font-size:32px;margin:8px 0 4px}p{margin:6px 0}.card{background:white;border:1px solid #ddd5c4;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 3px 12px rgba(34,48,60,.06)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}.choice,.style,.color{border:2px solid #ddd5c4;background:white;border-radius:16px;padding:12px;min-height:58px;cursor:pointer;font:inherit;text-align:center}.choice.on,.style.on,.color.on{border-color:#2f5d50;background:#e8f1ee;font-weight:bold}.swatch{width:100%;height:42px;border-radius:10px;border:1px solid rgba(0,0,0,.12);margin-bottom:7px}.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:19px;font-weight:bold;cursor:pointer;background:#2f5d50;color:white;margin:10px 0}.secondary{background:#e8f1ee;color:#2f5d50;border:1px solid #2f5d50}.hidden{display:none!important}.outfit{border:1px solid #ddd5c4;border-radius:18px;padding:14px;margin:12px 0;background:#fff}.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.parts>div>div:first-child{height:52px;border-radius:12px;border:1px solid rgba(0,0,0,.12)}.tag{display:inline-block;background:#e8f1ee;color:#2f5d50;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:bold;margin:4px 0}.muted{color:#68746f;font-size:15px}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:140px}.row .btn{margin:10px 0}.fav{background:#c0392b;color:white}.back{background:transparent;color:#2f5d50;border:1px solid #2f5d50}@media print{body{background:white;padding:0}main{max-width:none}.btn,.back,nav{display:none!important}.card,.outfit{box-shadow:none;break-inside:avoid}}</style></head><body><main><header><img src="icons/icon-192.png" alt="Logo FitMatch" width="120" height="120" style="border-radius:24px;max-width:100%"><h1>FitMatch</h1><p>Abbinamenti di colore per maglia, pantalone e scarpe.</p></header><section id="start" class="card"><h2>Come vuoi iniziare?</h2><div class="grid"><button class="choice" data-mode="shirt">Parto dalla maglia</button><button class="choice" data-mode="pants">Parto dal pantalone</button><button class="choice" data-mode="both">Scelgo entrambi</button></div></section><section id="picker" class="card hidden"><button class="btn secondary back" onclick="show('start')">← Torna indietro</button><div id="shirtPicker" class="hidden"><h2>Colore della maglia</h2><div class="colors" id="shirtColors"></div></div><div id="pantsPicker" class="hidden"><h2>Colore del pantalone</h2><div class="colors" id="pantsColors"></div></div><h2>Stile</h2><div class="grid"><button class="style" data-style="Casual">Casual</button><button class="style" data-style="Elegante">Elegante</button><button class="style" data-style="Streetwear">Streetwear</button><button class="style" data-style="Mix">Mix</button></div><button class="btn" id="generate" disabled>VEDI ABBINAMENTI</button></section><section id="results" class="card hidden"><button class="btn secondary back" onclick="show('picker')">← Modifica scelta</button><h2>Abbinamenti consigliati</h2><div id="outfits"></div><div class="row"><button class="btn secondary" onclick="shareResults()">CONDIVIDI</button><button class="btn secondary" onclick="window.print()">STAMPA / PDF</button><button class="btn secondary" onclick="show('favorites')">PREFERITI</button></div></section><section id="favorites" class="card hidden"><button class="btn secondary back" onclick="show('results')">← Risultati</button><h2>Preferiti</h2><p class="muted">Salvati solo su questo dispositivo e browser. Non sono sincronizzati online.</p><div id="favList"></div></section></main><script>
'use strict';const $=id=>document.getElementById(id);const COLORS=[['Bianco','#ffffff','neutral'],['Nero','#111111','neutral'],['Grigio','#9aa3a8','neutral'],['Grigio antracite','#3f4a52','neutral'],['Beige','#d9c7a7','neutral'],['Crema','#f3e6c8','neutral'],['Marrone','#7a5230','warm'],['Blu navy','#1f3a5f','cool'],['Azzurro','#7fb3d5','cool'],['Blu','#26619c','cool'],['Verde oliva','#708238','warm'],['Verde bosco','#2f5d50','cool'],['Verde','#3d8b37','cool'],['Bordeaux','#722f37','warm'],['Rosso','#c0392b','warm'],['Rosa','#e8a0b4','warm'],['Viola','#7d5ba6','cool'],['Giallo','#e8b830','warm'],['Arancione','#e07b39','warm'],['Denim','#4a6d8c','cool']];const byName=Object.fromEntries(COLORS.map(c=>[c[0],c]));let mode='',shirt='',pants='',style='',results=[];const KEY='fitmatch-favorites-v1';
function colorButton(name,hex){const b=document.createElement('button');b.className='color';b.type='button';b.innerHTML='<div class=swatch style="background:'+hex+'"></div>'+name;b.onclick=()=>{if(b.parentElement.id==='shirtColors'){shirt=name}else{pants=name};[...b.parentElement.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');update()};return b}
function update(){$('generate').disabled=!(style&&((mode==='shirt'&&shirt)||(mode==='pants'&&pants)||(mode==='both'&&shirt&&pants)))}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;shirt='';pants='';style='';document.querySelectorAll('.choice').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('shirtPicker').classList.toggle('hidden',mode==='pants');$('pantsPicker').classList.toggle('hidden',mode==='shirt');['shirtColors','pantsColors'].forEach(id=>{const box=$(id);box.replaceChildren();COLORS.forEach(([n,h])=>box.append(colorButton(n,h)))});document.querySelectorAll('.style').forEach(x=>x.classList.remove('on'));update();show('picker')});
document.querySelectorAll('.style').forEach(b=>b.onclick=()=>{style=b.dataset.style;document.querySelectorAll('.style').forEach(x=>x.classList.remove('on'));b.classList.add('on');update()});
function score(a,b){if(a===b)return 2;const A=byName[a],B=byName[b];if(A[2]==='neutral'||B[2]==='neutral')return 3;if(A[2]!==B[2])return 2;return 1}
function generate(){const fixedShirt=mode!=='pants'?shirt:null,fixedPants=mode!=='shirt'?pants:null,out=[];const shirts=COLORS.map(c=>c[0]),pantsList=COLORS.map(c=>c[0]);for(const s of shirts){for(const p of pantsList){if(fixedShirt&&s!==fixedShirt)continue;if(fixedPants&&p!==fixedPants)continue;if(s===p&&s!=='Nero'&&s!=='Bianco')continue;const shoes=bestShoes(s,p,style);const sc=score(s,p)+score(p,shoes[0])+(style==='Elegante'&&['Nero','Blu navy','Grigio antracite'].includes(p)?1:0)+(style==='Streetwear'&&['Denim','Bianco','Nero'].includes(p)?1:0);out.push({shirt:s,pants:p,shoes:shoes[0],alts:shoes.slice(1,3),score:sc,why:why(s,p,shoes[0])})}}out.sort((a,b)=>b.score-a.score||a.shirt.localeCompare(b.shirt));const seen=new Set();results=[];for(const o of out){const k=o.shirt+'|'+o.pants+'|'+o.shoes;if(seen.has(k))continue;seen.add(k);results.push(o);if(results.length===6)break}render()}
function bestShoes(s,p,st){const prefs={Casual:['Bianco','Marrone','Nero','Denim'],Elegante:['Nero','Marrone','Blu navy','Bordeaux'],Streetwear:['Bianco','Nero','Rosso','Denim'],Mix:['Bianco','Nero','Marrone','Verde bosco']};return prefs[st].slice().sort((a,b)=>score(p,b)+score(s,b)-(score(p,a)+score(s,a)))}
function why(s,p,f){if(byName[s][2]==='neutral'||byName[p][2]==='neutral')return 'Un colore neutro equilibra l\'outfit e lascia spazio al capo principale.';if(byName[s][2]!==byName[p][2])return 'Il contrasto controllato tra tonalità diverse crea un abbinamento definito ma armonioso.';return 'Le tonalità vicine creano un effetto coordinato, adatto a un look pulito.'}
function render(){$('outfits').replaceChildren();results.forEach((o,i)=>{const d=document.createElement('div');d.className='outfit';d.innerHTML='<span class=tag>'+o.shirt+' + '+o.pants+'</span><div class=parts><div><div style="background:'+byName[o.shirt][1]+'"></div><b>Maglia</b><div>'+o.shirt+'</div></div><div><div style="background:'+byName[o.pants][1]+'"></div><b>Pantalone</b><div>'+o.pants+'</div></div><div><div style="background:'+byName[o.shoes][1]+'"></div><b>Scarpe</b><div>'+o.shoes+'</div></div></div><p><b>Stile:</b> '+style+'</p><p>'+o.why+'</p><p class=muted>Alternative scarpe: '+o.alts.join(', ')+'</p>';const save=document.createElement('button');save.className='btn fav';save.textContent='SALVA NEI PREFERITI';save.onclick=()=>addFav(o);d.append(save);$('outfits').append(d)});show('results')}
$('generate').onclick=generate;
function loadFavs(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
function saveFavs(v){try{localStorage.setItem(KEY,JSON.stringify(v));return true}catch(e){alert('Impossibile salvare i preferiti in questo browser.');return false}}
function addFav(o){const favs=loadFavs();if(favs.some(x=>x.shirt===o.shirt&&x.pants===o.pants&&x.shoes===o.shoes&&x.style===style))return;favs.unshift({...o,style,date:new Date().toLocaleDateString('it-IT')});saveFavs(favs);renderFavs()}
function renderFavs(){const box=$('favList');box.replaceChildren();const favs=loadFavs();if(!favs.length){box.append(Object.assign(document.createElement('p'),{className:'muted',textContent:'Nessun preferito salvato.'}));return}favs.forEach((o,i)=>{const d=document.createElement('div');d.className='outfit';d.innerHTML='<span class=tag>'+o.style+'</span><div class=parts><div><div style="background:'+byName[o.shirt][1]+'"></div><b>Maglia</b><div>'+o.shirt+'</div></div><div><div style="background:'+byName[o.pants][1]+'"></div><b>Pantalone</b><div>'+o.pants+'</div></div><div><div style="background:'+byName[o.shoes][1]+'"></div><b>Scarpe</b><div>'+o.shoes+'</div></div></div><p class=muted>Salvato il '+o.date+'</p>';const del=document.createElement('button');del.className='btn fav';del.textContent='RIMUOVI';del.onclick=()=>{const v=loadFavs();v.splice(i,1);saveFavs(v);renderFavs()};d.append(del);box.append(d)})}
function summary(){return results.map((o,i)=>(i+1)+'. Maglia '+o.shirt+', pantalone '+o.pants+', scarpe '+o.shoes+' — '+style+'. '+o.why).join('\n')}
function shareResults(){const text='FitMatch — abbinamenti '+style+':\n\n'+summary();if(navigator.share){navigator.share({title:'FitMatch',text:text}).catch(()=>{})}else{navigator.clipboard.writeText(text).then(()=>alert('Riepilogo copiato.')).catch(()=>alert(text))}}
function show(id){['start','picker','results','favorites'].forEach(k=>$(k).classList.toggle('hidden',k!==id));if(id==='favorites')renderFavs();window.scrollTo(0,0)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}))}
</script><script charset="utf-8" src="fitmatch-v2.js"></script></body></html>
