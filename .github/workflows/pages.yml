name: Pubblica FitMatch su Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: fitmatch-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Prepara logo e percorsi
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64,io,re,json
          logo=''
          image=Image.open(io.BytesIO(base64.b64decode(logo))).convert('RGB')
          Path('icons').mkdir(exist_ok=True)
          for size in (32,180,192,512):
              image.resize((size,size),Image.Resampling.LANCZOS).save(f'icons/icon-{size}.png')
          mask=Image.new('RGB',(512,512),'#f5efe1')
          mask.paste(image.resize((360,360),Image.Resampling.LANCZOS),(76,76))
          mask.save('icons/maskable-512.png')
          p=Path('index.html'); html=p.read_text()
          html=re.sub(r'<link rel="(?:icon|apple-touch-icon)"[^>]*>','',html)
          html=html.replace('<title>','<link rel="icon" href="icons/icon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png"><title>',1)
          if 'alt="Logo FitMatch"' not in html:
              html=html.replace('<header>','<header><img src="icons/icon-192.png" alt="Logo FitMatch" width="120" height="120" style="border-radius:24px;max-width:100%">',1)
          html=html.replace('.part div:first-child{','.parts>div>div:first-child{').replace('.row{display:flex;gap:8px}', '.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:140px}')
          p.write_text(html)
          manifest={'name':'FitMatch','short_name':'FitMatch','lang':'it','start_url':'./','scope':'./','display':'standalone','background_color':'#f5efe1','theme_color':'#2f5d50','icons':[{'src':f'icons/icon-{s}.png','sizes':f'{s}x{s}','type':'image/png','purpose':'any'} for s in (192,512)]+[{'src':'icons/maskable-512.png','sizes':'512x512','type':'image/png','purpose':'maskable'}]}
          Path('manifest.webmanifest').write_text(json.dumps(manifest))
          sw="const CACHE='fitmatch-pages-v4';const BASE=new URL('./',self.location.href);const URLS=['./','index.html','manifest.webmanifest','icons/icon-32.png','icons/icon-180.png','icons/icon-192.png','icons/icon-512.png','icons/maskable-512.png'].map(p=>new URL(p,BASE).href);self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(URLS)).then(()=>self.skipWaiting())));self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('fitmatch-')&&k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.origin!==BASE.origin||!u.pathname.startsWith(BASE.pathname))return;if(e.request.mode==='navigate'){e.respondWith(fetch(e.request).then(async r=>{if(r.ok){const c=await caches.open(CACHE);await c.put(new URL('index.html',BASE),r.clone())}return r}).catch(()=>caches.match(new URL('index.html',BASE))));return}e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))});"
          Path('service-worker.js').write_text(sw)
          for script in re.findall(r'<script>(.*?)</script>',html,re.S):
              Path('/tmp/fitmatch-check.js').write_text(script)
          PY
          node --check /tmp/fitmatch-check.js
          node --check service-worker.js
      - name: Salva logo e risorse nel repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest service-worker.js icons/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna logo e percorsi PWA per GitHub Pages'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepara sito
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest service-worker.js _site/
          cp -R icons _site/icons
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
